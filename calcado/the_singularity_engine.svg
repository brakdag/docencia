<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fondo Espacial Profundo -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#0A0E29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>

    <!-- Núcleo de Energía (Singularidad) -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#00F2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0" />
    </radialGradient>

    <!-- Oro Tecnológico -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>

    <!-- Filtro de Resplandor -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="800" fill="url(#spaceGrad)" />

  <!-- Estrellas de Fondo (Ruido Matemático) -->
  <g fill="white">
    <circle cx="100" cy="150" r="1" opacity="0.5" />
    <circle cx="700" cy="100" r="1.5" opacity="0.8" />
    <circle cx="400" cy="50" r="1" opacity="0.3" />
    <circle cx="150" cy="600" r="1.2" opacity="0.6" />
    <circle cx="650" cy="700" r="1" opacity="0.4" />
    <circle cx="300" cy="750" r="1.5" opacity="0.7" />
    <circle cx="50" cy="400" r="1" opacity="0.5" />
    <circle cx="750" cy="400" r="1.2" opacity="0.6" />
  </g>

  <!-- EL MOTOR DE LA SINGULARIDAD -->
  <g transform="translate(400, 400)">
    
    <!-- Capa 1: El Aura Exterior (Anillos de Datos) -->
    <g stroke="#00F2FF" stroke-width="1" fill="none" opacity="0.3" filter="url(#glow)">
      <circle r="350" stroke-dasharray="10,20" />
      <circle r="330" stroke-dasharray="5,15" />
      <circle r="310" stroke-dasharray="2,10" />
    </g>

    <!-- Capa 2: Los Pétalos Geométricos (Simetría de 12) -->
    <g id="petalGroup">
      <path d="M 0,-300 L 40,-200 L 0,-150 L -40,-200 Z" fill="url(#goldGrad)" stroke="black" stroke-width="1" opacity="0.8" />
      <path d="M 0,-140 L 20,-100 L 0,-80 L -20,-100 Z" fill="#00F2FF" stroke="black" stroke-width="1" opacity="0.6" />
    </g>
    
    <!-- Rotación de los Pétalos -->
    <use href="#petalGroup" transform="rotate(0)" />
    <use href="#petalGroup" transform="rotate(30)" />
    <use href="#petalGroup" transform="rotate(60)" />
    <use href="#petalGroup" transform="rotate(90)" />
    <use href="#petalGroup" transform="rotate(120)" />
    <use href="#petalGroup" transform="rotate(150)" />
    <use href="#petalGroup" transform="rotate(180)" />
    <use href="#petalGroup" transform="rotate(210)" />
    <use href="#petalGroup" transform="rotate(240)" />
    <use href="#petalGroup" transform="rotate(270)" />
    <use href="#petalGroup" transform="rotate(300)" />
    <use href="#petalGroup" transform="rotate(330)" />

    <!-- Capa 3: El Hexágono de Control -->
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" 
             fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#glow)" />

    <!-- Capa 4: Circuitos Internos (Líneas de Conexión) -->
    <g stroke="#00F2FF" stroke-width="2" opacity="0.7" filter="url(#glow)">
      <line x1="0" y1="0" x2="0" y2="-200" />
      <line x1="0" y1="0" x2="173" y2="-100" />
      <line x1="0" y1="0" x2="173" y2="100" />
      <line x1="0" y1="0" x2="0" y2="200" />
      <line x1="0" y1="0" x2="-173" y2="100" />
      <line x1="0" y1="0" x2="-173" y2="-100" />
    </g>

    <!-- Capa 5: El Núcleo (La Singularidad) -->
    <circle r="60" fill="url(#coreGrad)" filter="url(#glow)" />
    <circle r="20" fill="white" />
  </g>
</svg>